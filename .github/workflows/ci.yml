name: Native cross-platform checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: alb
          - os: macos-latest
            binary: alb
          - os: windows-latest
            binary: alb.exe
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Remap build-machine paths
        shell: bash
        run: |
          BUILD_HOME="${USERPROFILE:-$HOME}"
          echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=/alb --remap-path-prefix=$BUILD_HOME=/build-home --remap-path-prefix=$RUNNER_TEMP=/build-temp" >> "$GITHUB_ENV"
      - name: Format
        run: cargo +stable fmt --check
      - name: Test native filesystem behavior
        run: cargo +stable test --locked
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - name: Verify release build
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_PROFILE_RELEASE_DEBUG: "0"
        run: cargo +stable build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: alb-${{ runner.os }}-${{ runner.arch }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
