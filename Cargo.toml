[package]
name = "alb"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "Build an organized audio library with metadata sorting, exact deduplication, and verified copies"
repository = "https://github.com/Crinklebine/alb"
readme = "README.md"
keywords = ["audio", "music", "library", "organizer", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
lofty = "=0.25.2"
blake3 = "=1.8.7"
unicode-normalization = "=0.1.25"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Console", "Win32_System_IO"] }
