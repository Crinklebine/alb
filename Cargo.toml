[package]
name = "alb"
version = "0.1.6"
edition = "2024"
rust-version = "1.89"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
lofty = "=0.25.2"
blake3 = "=1.8.7"
unicode-normalization = "=0.1.25"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }
